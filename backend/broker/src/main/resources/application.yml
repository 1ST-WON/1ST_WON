spring:
  application:
    name: won-broker

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:woncoin}?currentSchema=broker
    username: ${BROKER_DB_USER:broker_user}
    password: ${BROKER_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none

server:
  port: ${BROKER_PORT:8082}
