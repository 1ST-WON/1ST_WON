name: sensitive-approvals
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  pull-requests: read
jobs:
  sensitive-approvals:
    # dev → main은 승인 1명 (ADR-76). 민감 영역 2명은 작업 브랜치 → dev에만 적용.
    if: github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // TODO(mock 피드백): "보안 설정" 경로가 노션에 없어 컨트랙트·마이그레이션만 검사
            const SENSITIVE = ['contracts/', 'infra/flyway/sql/'];
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number });
            const hits = files.map((f) => f.filename).filter((name) => SENSITIVE.some((p) => name.startsWith(p)));
            if (hits.length === 0) {
              core.info('민감 영역 변경 없음: 승인 1명 규칙(Ruleset)만 적용');
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number });
            const latest = new Map();
            for (const r of reviews) {
              if (r.user.login === pr.user.login) continue;
              if (r.state === 'COMMENTED') continue;
              latest.set(r.user.login, r.state);
            }
            const approvers = [...latest].filter(([, s]) => s === 'APPROVED').map(([u]) => u);

            if (approvers.length < 2) {
              core.setFailed(`민감 영역 변경(${hits.join(', ')}): 승인 2명이 필요합니다. 현재 ${approvers.length}명 (${approvers.join(', ') || '없음'})`);
            } else {
              core.info(`민감 영역 승인 ${approvers.length}명: ${approvers.join(', ')}`);
            }
