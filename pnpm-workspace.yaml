# TODO(mock 피드백): 노션에 워크스페이스 구성이 없어 진행자가 임시로 작성.
# pnpm을 쓰는 폴더만 넣음(ADR-10 모노레포, ADR-8 pnpm, ADR-31 Hardhat). backend는 Gradle이라 제외.
packages:
  - frontend/issuer
  - frontend/broker
  - frontend/mts
  - contracts
allowBuilds:
  esbuild: true
# Node가 .nvmrc(package.json engines)와 다르면 설치를 실패시킨다 (ADR-7 보충, ADR-80).
engineStrict: true
# Mac·Windows에서 같은 pnpm 명령이 같은 셸 문법으로 돌게 한다.
shellEmulator: true
